<!-- 小氣簿 home-screen icon — a miniature of the closed 封面 (CoverPage.jsx).
     Every colour is a --shb-* token from siuHeiBouStyles.css.

     Deliberately SQUARE, unlike games/da-siu-yan/icon.svg: iOS masks
     apple-touch-icon with its own squircle and Android maskable wants full
     bleed, so pre-rounding here would bake dark wedges into the corners.
     All content sits inside the maskable safe circle (r=205 from centre), so a
     circular crop only ever eats red and the binding band.

     The 小氣簿 wordmark needs 'LXGW WenKai TC' — a Google webfont the app loads
     at runtime (SiuHeiBouGame.jsx FONT_HREF), NOT a local font. icon-192.png /
     icon-512.png were rasterized through headless Chrome with that font loaded;
     opening this .svg on a machine without it falls back to PingFang. Those
     PNGs are what the manifest ships — regenerate them the same way if you edit
     this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- .shb-bcover-frontface: linear-gradient(160deg, --shb-cover, --shb-cover-deep) -->
    <linearGradient id="cover" x1="0.32" y1="0.03" x2="0.68" y2="0.97">
      <stop offset="0" stop-color="#b04a3a"/>
      <stop offset="1" stop-color="#8e3a2d"/>
    </linearGradient>
    <!-- the cover's inset 8px 0 0 rgba(0,0,0,.18) spine shadow, softened -->
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="0.38" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#cover)"/>
  <rect width="36" height="512" fill="url(#spine)"/>

  <!-- .shb-cover-band — the binding stripe, #6f4a3d at 0.85 -->
  <rect x="446" y="0" width="26" height="512" fill="#6f4a3d" opacity="0.85"/>

  <!-- .shb-cover-plate — cream paper on the leather, with its 0 3px 0 hard shadow -->
  <rect x="125" y="136" width="262" height="264" rx="20" fill="#000000" opacity="0.18"/>
  <rect x="125" y="128" width="262" height="264" rx="20" fill="#f7f0e3"/>

  <!-- AngryFace level={3} (svgs.jsx), 32u artboard scaled 4.0625x -->
  <g transform="translate(191 156) scale(4.0625)"
     stroke="#b3402f" stroke-linecap="round" fill="none">
    <path d="M16 3 C24 2.4 29.6 9 29 16 C28.4 24 23 29.6 16 29 C8 28.4 2.4 23 3 16 C3.6 8 9 3.6 16 3 Z"
          fill="#ffe3e0" stroke-width="1.6"/>
    <path d="M7 11 L14 16" stroke-width="2"/>
    <path d="M25 11 L18 16" stroke-width="2"/>
    <circle cx="12" cy="17" r="1.4" fill="#b3402f" stroke="none"/>
    <circle cx="20" cy="17" r="1.4" fill="#b3402f" stroke="none"/>
    <path d="M12 24 Q16 18 20 24 Q16 26 12 24 Z" fill="#b3402f" stroke-width="1.8"/>
    <path d="M24 7 L27 4 M26 9 L29.5 7" stroke-width="1.6"/>
  </g>

  <!-- .shb-cover-title — one <text> per glyph so the wide letter-spacing stays
       optically centred (SVG letter-spacing also trails the final glyph) -->
  <g fill="#b3402f" font-family="LXGW WenKai TC, PingFang HK, Microsoft JhengHei, serif"
     font-size="58" font-weight="700" text-anchor="middle">
    <text x="185" y="362">小</text>
    <text x="256" y="362">氣</text>
    <text x="327" y="362">簿</text>
  </g>
</svg>
